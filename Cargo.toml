[package]
name         = "chroma"
version      = "0.8.1"
edition      = "2024"
rust-version = "1.89"
license-file = "LICENSE.md"
repository   = "https://github.com/LiGoldragon/chroma"
description  = "Chroma — one Rust daemon for theme, warmth, and brightness, controlled via Datom."

[lib]
path = "src/lib.rs"

[[bin]]
name = "chroma"
path = "src/bin/chroma.rs"

[[bin]]
name = "chroma-daemon"
path = "src/bin/chroma_daemon.rs"

[features]
default = ["datom"]
# Gates the Datomizable and Composing derives on generated types. The library, CLI and config
# textualize with Datom in every build, so datom is default and datom-codec stays unconditional.
datom   = []

[dependencies]
chrono       = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
kameo        = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main", default-features = false, features = ["macros", "tracing"] }
datom-codec  = { git = "https://github.com/LiGoldragon/datom-codec", rev = "4dff16b4f7412febc3b71aac8b49680cd20988cb", features = ["rkyv"] }
notify       = "5.2"
redb         = "2.6.3"
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
protos       = { git = "https://github.com/LiGoldragon/protos", rev = "15b41da8f2579e73ead59bc0c2b97529b8ac32d3", features = ["rkyv"] }
sunrise      = "3"
thiserror    = "2"
tempfile     = "3"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "process", "fs"] }
zbus         = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "c2653dd82adbdb1f1f2f654405c6620e0d06fd58" }

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }
