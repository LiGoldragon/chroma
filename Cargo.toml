[package]
name         = "chroma"
version      = "0.1.0"
edition      = "2024"
rust-version = "1.88"
license-file = "LICENSE.md"
repository   = "https://github.com/LiGoldragon/chroma"
description  = "Chroma — one Rust daemon for theme, warmth, and brightness, controlled via NOTA."

[lib]
path = "src/lib.rs"

[[bin]]
name = "chroma"
path = "src/bin/chroma.rs"

[[bin]]
name = "chroma-daemon"
path = "src/bin/chroma_daemon.rs"

[dependencies]
chrono       = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
kameo        = { version = "0.20", default-features = false, features = ["macros", "tracing"] }
nota-next    = { git = "https://github.com/LiGoldragon/nota-next.git", branch = "main" }
notify       = "5.2"
redb         = "2.6.3"
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
sunrise      = "3"
thiserror    = "2"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "process", "fs"] }
zbus         = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
