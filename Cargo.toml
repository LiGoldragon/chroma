[package]
name         = "chroma"
version      = "0.7.0"
edition      = "2024"
rust-version = "1.89"
license-file = "LICENSE.md"
repository   = "https://github.com/LiGoldragon/chroma"
description  = "Chroma — one Rust daemon for theme, warmth, and brightness, controlled via Datom."

[lib]
path = "src/lib.rs"

[[bin]]
name = "chroma"
path = "src/bin/chroma.rs"

[[bin]]
name = "chroma-daemon"
path = "src/bin/chroma_daemon.rs"

[dependencies]
chrono       = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
kameo        = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main", default-features = false, features = ["macros", "tracing"] }
datom-codec  = { git = "https://github.com/LiGoldragon/datom-codec", rev = "09e2a9d52bf7f2f11e51d15cb6c3177f72c6c927" }
notify       = "5.2"
redb         = "2.6.3"
rkyv         = { version = "0.8", default-features = false, features = ["std", "bytecheck", "little_endian", "pointer_width_32", "unaligned"] }
protos       = { git = "https://github.com/LiGoldragon/protos", rev = "1febca7836bf8d5f5973a302fdd50aa9c84c159b" }
sunrise      = "3"
thiserror    = "2"
tempfile     = "3"
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "signal", "sync", "time", "process", "fs"] }
zbus         = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
ethos-zero = { git = "https://github.com/LiGoldragon/ethos-zero", rev = "4bf73cae8d4f5a2072c76a11cd2f00aa3fe9f8e3" }

[patch.crates-io]
kameo = { git = "https://github.com/LiGoldragon/kameo.git", branch = "main" }
